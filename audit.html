{% extends "base.html" %}{% block content %}<h1 class="title">Audit log</h1><div class="card"><div class="tablewrap"><table><thead><tr><th>When</th><th>User</th><th>Action</th><th>Record</th><th>Details</th></tr></thead><tbody>{% for a in rows %}<tr><td>{{ a.created_at }}</td><td>{{ a.username or '-' }}</td><td>{{ a.action }}</td><td>{{ a.record_type }} #{{ a.record_id }}</td><td>{{ a.details }}</td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
