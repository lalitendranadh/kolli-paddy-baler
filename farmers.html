{% extends "base.html" %}{% block content %}<h1 class="title">Farmers</h1><div class="card"><form method="get"><label>Search by name, mobile or village</label><input name="q" value="{{ q }}" placeholder="Search"><br><br><button>Search</button></form></div>
<div class="card"><div class="tablewrap"><table><thead><tr><th>Name</th><th>Mobile</th><th>Village</th><th></th></tr></thead><tbody>{% for f in farmers %}<tr><td>{{ f.name }}</td><td>{{ f.mobile }}</td><td>{{ f.village }}</td><td><a href="{{ url_for('farmer_detail',fid=f.id) }}">History</a></td></tr>{% else %}<tr><td colspan="4">No farmers found.</td></tr>{% endfor %}</tbody></table></div></div>
<div class="card"><h2>Add / update farmer</h2><form method="post"><div class="formgrid"><div><label>Name</label><input name="name" required></div><div><label>Mobile</label><input name="mobile" inputmode="tel" required></div><div><label>Village</label><input name="village" required></div></div><br><button>Save farmer</button></form></div>{% endblock %}
