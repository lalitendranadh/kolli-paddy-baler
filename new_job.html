{% extends "base.html" %}{% block content %}<h1 class="title">New Rolling Entry</h1><p class="muted">Use the mobile number to find returning farmers and keep their history together.</p><div class="card"><form method="post" id="jobform"><label>Date &amp; time</label><input type="datetime-local" name="date_time" value="{{ now }}" required><br><br><label>Farmer mobile number</label><input id="mobile" name="mobile" inputmode="tel" required><br><br><div class="formgrid"><div><label>Farmer name</label><input id="name" name="name" required></div><div><label>Village</label><input id="village" name="village" required></div><div><label>Number of rolls</label><input id="rolls" name="rolls" type="number" min="1" required></div><div><label>Rate per roll (₹30–₹40)</label><input id="rate" name="rate" type="number" min="30" max="40" value="35" required></div></div><br><div class="stat"><span class="muted">Calculated amount</span><strong id="total">₹0.00</strong></div><br><button class="full">Save entry &amp; send SMS</button></form></div>
<script>
const mobile=document.getElementById('mobile');let debounce;
mobile.addEventListener('input',()=>{clearTimeout(debounce);debounce=setTimeout(async()=>{if(mobile.value.trim().length<5)return;try{const r=await fetch('/api/farmer?mobile='+encodeURIComponent(mobile.value.trim()));const f=await r.json();if(f.found){document.getElementById('name').value=f.name;document.getElementById('village').value=f.village;}}catch(e){}},250)});
function calc(){let n=Number(document.getElementById('rolls').value||0),r=Number(document.getElementById('rate').value||0);document.getElementById('total').textContent='₹'+(n*r).toFixed(2)}
document.getElementById('rolls').addEventListener('input',calc);document.getElementById('rate').addEventListener('input',calc);
</script>{% endblock %}
