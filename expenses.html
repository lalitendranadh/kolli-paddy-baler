{% extends "base.html" %}{% block content %}<h1 class="title">Maintenance & Expenses</h1><div class="card"><form method="post"><div class="formgrid"><div><label>Date</label><input name="date" type="date" value="{{ today }}" required></div><div><label>Category</label><select name="category"><option>Diesel</option><option>Driver Wages</option><option>Repair</option><option>Spare Parts</option><option>Other</option></select></div><div><label>Amount (₹)</label><input name="amount" type="number" step=".01" min="0" required></div><div><label>Rolls completed today (optional)</label><input name="rolls_today" type="number" min="0"></div></div><br><label>Description / bill details</label><textarea name="description" rows="2"></textarea><br><br><button>Save expense</button></form></div><div class="card"><h2>Recent expenses</h2><div class="tablewrap"><table><thead><tr><th>Date</th><th>Category</th><th>Description</th><th>Amount</th><th>Roll count</th></tr></thead><tbody>{% for e in expenses %}<tr><td>{{ e.date }}</td><td>{{ e.category }}</td><td>{{ e.description }}</td><td>₹{{ e.amount }}</td><td>{{ e.rolls_today or '-' }}</td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
